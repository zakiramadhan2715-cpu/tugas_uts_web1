<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Toko Buku UT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Toko Buku Universitas terbuka</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="stok.html">Stok Buku</a>
            <a href="checkout.html">Checkout</a>
            <a href="tracking.html">Tracking</a>
            <a href="#" id="logoutBtn">Logout</a>
        </nav>
    </header>

    <div class="container">
        <h2>Form Checkout Buku</h2>
        <form id="checkoutForm" style="background: white; padding: 20px; border-radius: 8px; margin-top: 20px;">
            <div class="form-group">
                <label for="pilihBuku">Pilih Buku</label>
                <select id="pilihBuku" required></select>
            </div>
            <div class="form-group">
                <label for="jumlah">Jumlah Pembelian</label>
                <input type="number" id="jumlah" min="1" value="1" required>
            </div>
            <div class="form-group">
                <label for="alamat">Alamat Pengiriman</label>
                <input type="text" id="alamat" placeholder="Masukkan alamat lengkap" required>
            </div>
            <button type="submit" class="btn">Proses Checkout</button>
        </form>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
